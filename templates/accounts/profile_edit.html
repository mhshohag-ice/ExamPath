
{% extends 'base.html' %}
{% block content %}
<div class="container-custom py-4" style="max-width:600px;">
  <div class="card-premium">
    <h4>Edit Profile</h4>
    <form method="post">
      {% csrf_token %}
      <div class="mb-3"><label class="form-label">Bio</label><textarea name="bio" class="form-control">{{ profile.bio }}</textarea></div>
      <div class="mb-3"><label class="form-label">Language</label><select name="language" class="form-select"><option value="en" {% if profile.language == 'en' %}selected{% endif %}>English</option><option value="bn" {% if profile.language == 'bn' %}selected{% endif %}>Bengali</option></select></div>
      <button type="submit" class="btn btn-accent btn-premium">Save</button>
    </form>
  </div>
</div>
{% endblock %}
